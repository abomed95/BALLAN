name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ballan
          POSTGRES_PASSWORD: ballan
          POSTGRES_DB: ballan_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ballan -d ballan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BALLAN_TEST_DSN: postgresql://ballan:ballan@localhost:5433/ballan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependances
        run: |
          python -m pip install -r requirements/serveur.lock
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Completude des traductions
        run: python -m core.i18n.rapport
      - name: Tests (unitaires et integration PostgreSQL)
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image Docker
        run: docker build -t ballan:ci .
      - name: Fumee — le simulateur demarre dans l'image
        run: echo "menu" | docker run --rm -i ballan:ci simuler | grep -q "École Sahan"
