[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballan"
version = "0.1.0"
description = "BALLAN — agent de rendez-vous, de rappels et de communication pour ecoles privees"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Le noyau domaine (creneaux, calendrier, i18n, regles) est en Python pur :
# aucune dependance, donc testable sans base de donnees ni reseau.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "httpx>=0.27"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
sched = ["apscheduler>=3.10"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["core", "verticals"]

[tool.setuptools.package-data]
core = ["i18n/locales/*.json"]
verticals = ["school/prompts/*", "school/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
